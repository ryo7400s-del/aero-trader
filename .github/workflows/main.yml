name: Run Aero Trader Agent

on:
  schedule:
    - cron: '0 */4 * * *'  # 4譎る俣縺翫″縺ｫ螳溯｡� (UTC)
  workflow_dispatch:        # 謇句虚螳溯｡後ｂ蜿ｯ閭ｽ

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run agent
        env:
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          CDP_WALLET_SECRET: ${{ secrets.CDP_WALLET_SECRET }}
        run: node agent.js
